<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1230" viewBox="0 0 1700 1230" role="img" aria-label="管理员处理举报时序图"><rect width="1700" height="1230" fill="#ffffff"/><defs><marker id="solidArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 11 6 L 0 12 Z" fill="#171717" stroke="#171717" stroke-width="0.8"/></marker><marker id="openArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 11 6 L 0 12" fill="#ffffff" stroke="#171717" stroke-width="1.2"/></marker></defs><g font-family="Microsoft YaHei, SimHei, sans-serif" fill="none" stroke="#171717"><line x1="145" y1="148" x2="145" y2="1178" stroke="#555555" stroke-width="1.1" stroke-dasharray="7 9"/><line x1="585" y1="148" x2="585" y2="1178" stroke="#555555" stroke-width="1.1" stroke-dasharray="7 9"/><line x1="1045" y1="148" x2="1045" y2="1178" stroke="#555555" stroke-width="1.1" stroke-dasharray="7 9"/><line x1="1490" y1="148" x2="1490" y2="1178" stroke="#555555" stroke-width="1.1" stroke-dasharray="7 9"/><rect x="136" y="223" width="18" height="910" fill="#ffffff" stroke="#171717" stroke-width="1.3"/><rect x="576" y="223" width="18" height="910" fill="#ffffff" stroke="#171717" stroke-width="1.3"/><rect x="1036" y="281" width="18" height="214" fill="#ffffff" stroke="#171717" stroke-width="1.3"/><rect x="1036" y="571" width="18" height="504" fill="#ffffff" stroke="#171717" stroke-width="1.3"/><rect x="1481" y="339" width="18" height="98" fill="#ffffff" stroke="#171717" stroke-width="1.3"/><rect x="1481" y="629" width="18" height="388" fill="#ffffff" stroke="#171717" stroke-width="1.3"/></g><g font-family="Microsoft YaHei, SimHei, sans-serif"><circle cx="145" cy="31" r="10" fill="none" stroke="#171717" stroke-width="1.6"/><line x1="145" y1="41" x2="145" y2="66" stroke="#171717" stroke-width="1.6"/><line x1="127" y1="49" x2="163" y2="49" stroke="#171717" stroke-width="1.6"/><line x1="145" y1="66" x2="129" y2="85" stroke="#171717" stroke-width="1.6"/><line x1="145" y1="66" x2="161" y2="85" stroke="#171717" stroke-width="1.6"/><rect x="70" y="92" width="150" height="56" fill="#ffffff" stroke="#171717" stroke-width="1.6"/><text x="145" y="127" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="500" fill="#111111">管理员</text><rect x="475" y="92" width="220" height="56" fill="#ffffff" stroke="#171717" stroke-width="1.6"/><text x="585" y="127" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="500" fill="#111111">举报管理页</text><rect x="935" y="92" width="220" height="56" fill="#ffffff" stroke="#171717" stroke-width="1.6"/><text x="1045" y="127" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="500" fill="#111111">举报控制器</text><rect x="1380" y="92" width="220" height="56" fill="#ffffff" stroke="#171717" stroke-width="1.6"/><text x="1490" y="127" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="500" fill="#111111">数据库</text><line x1="154" y1="235" x2="576" y2="235" stroke="#171717" stroke-width="1.8" marker-end="url(#solidArrow)"/><text x="365" y="225" text-anchor="middle" font-size="15" fill="#111111">1.输入管理员账号和密码()</text><line x1="594" y1="293" x2="1036" y2="293" stroke="#171717" stroke-width="1.8" marker-end="url(#solidArrow)"/><text x="815" y="283" text-anchor="middle" font-size="15" fill="#111111">2.提交管理员登录请求()</text><line x1="1054" y1="351" x2="1481" y2="351" stroke="#171717" stroke-width="1.8" marker-end="url(#solidArrow)"/><text x="1267.5" y="341" text-anchor="middle" font-size="15" fill="#111111">3.查询管理员并验证密码()</text><line x1="1481" y1="409" x2="1054" y2="409" stroke="#171717" stroke-width="1.35" stroke-dasharray="8 6" marker-end="url(#openArrow)"/><text x="1267.5" y="399" text-anchor="middle" font-size="15" fill="#111111">4.返回管理员信息</text><line x1="1036" y1="467" x2="594" y2="467" stroke="#171717" stroke-width="1.35" stroke-dasharray="8 6" marker-end="url(#openArrow)"/><text x="815" y="457" text-anchor="middle" font-size="15" fill="#111111">5.返回令牌并进入举报页</text><line x1="154" y1="525" x2="576" y2="525" stroke="#171717" stroke-width="1.8" marker-end="url(#solidArrow)"/><text x="365" y="515" text-anchor="middle" font-size="15" fill="#111111">6.筛选待处理举报记录()</text><line x1="594" y1="583" x2="1036" y2="583" stroke="#171717" stroke-width="1.8" marker-end="url(#solidArrow)"/><text x="815" y="573" text-anchor="middle" font-size="15" fill="#111111">7.请求举报分页数据()</text><line x1="1054" y1="641" x2="1481" y2="641" stroke="#171717" stroke-width="1.8" marker-end="url(#solidArrow)"/><text x="1267.5" y="631" text-anchor="middle" font-size="15" fill="#111111">8.查询举报及目标对象信息()</text><line x1="1481" y1="699" x2="1054" y2="699" stroke="#171717" stroke-width="1.35" stroke-dasharray="8 6" marker-end="url(#openArrow)"/><text x="1267.5" y="689" text-anchor="middle" font-size="15" fill="#111111">9.返回举报记录列表</text><line x1="1036" y1="757" x2="594" y2="757" stroke="#171717" stroke-width="1.35" stroke-dasharray="8 6" marker-end="url(#openArrow)"/><text x="815" y="747" text-anchor="middle" font-size="15" fill="#111111">10.返回举报列表</text><line x1="154" y1="815" x2="576" y2="815" stroke="#171717" stroke-width="1.8" marker-end="url(#solidArrow)"/><text x="365" y="805" text-anchor="middle" font-size="15" fill="#111111">11.选择处理或忽略并填写备注()</text><line x1="594" y1="873" x2="1036" y2="873" stroke="#171717" stroke-width="1.8" marker-end="url(#solidArrow)"/><text x="815" y="863" text-anchor="middle" font-size="15" fill="#111111">12.提交举报处理结果()</text><line x1="1054" y1="931" x2="1481" y2="931" stroke="#171717" stroke-width="1.8" marker-end="url(#solidArrow)"/><text x="1267.5" y="921" text-anchor="middle" font-size="15" fill="#111111">13.更新举报状态与备注()</text><line x1="1481" y1="989" x2="1054" y2="989" stroke="#171717" stroke-width="1.35" stroke-dasharray="8 6" marker-end="url(#openArrow)"/><text x="1267.5" y="979" text-anchor="middle" font-size="15" fill="#111111">14.返回更新结果</text><line x1="1036" y1="1047" x2="594" y2="1047" stroke="#171717" stroke-width="1.35" stroke-dasharray="8 6" marker-end="url(#openArrow)"/><text x="815" y="1037" text-anchor="middle" font-size="15" fill="#111111">15.返回举报处理成功</text><line x1="576" y1="1105" x2="154" y2="1105" stroke="#171717" stroke-width="1.35" stroke-dasharray="8 6" marker-end="url(#openArrow)"/><text x="365" y="1095" text-anchor="middle" font-size="15" fill="#111111">16.显示举报处理结果</text></g></svg>
